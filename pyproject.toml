[project]
name = "grubhub-mcp"
version = "1.1.6"
description = "MCP server for Grubhub — search restaurants, browse menus, manage cart, place orders"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "aserper" }]
keywords = ["mcp", "grubhub", "food-delivery", "restaurant", "ordering"]
dependencies = [
    # Upper bound: mcp 2.x removed mcp.server.fastmcp (FastMCP was renamed
    # MCPServer and moved to mcp.server.mcpserver), so an unbounded requirement
    # makes a fresh install fail to import.
    # Lower bound: before 1.14.0 FastMCP inspected raw annotations, which blows
    # up with `TypeError: issubclass() arg 1 must be a class` on the `X | None`
    # tool parameters used here under `from __future__ import annotations`.
    "mcp>=1.14.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "python-semantic-release>=9.0.0",
    "build>=1.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
grubhub = "grubhub_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages]
find = { where = ["src"] }

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
# Keep the Claude Code plugin manifest's version in lockstep with the package.
# marketplace.json carries no version field, so there is nothing to stamp there.
version_variables = [".claude-plugin/plugin.json:version"]
assets = [".claude-plugin/plugin.json", ".claude-plugin/marketplace.json"]
branch = "master"
commit_parser = "angular"
major_on_zero = false
build_command = "python -m build"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
